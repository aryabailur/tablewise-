apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 5s
    editable: false

  - name: Postgres
    uid: postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: tablewise
    jsonData:
      database: tablewise
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: tablewise
    editable: false
