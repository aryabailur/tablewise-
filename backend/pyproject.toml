[project]
name = "tablewise-backend"
version = "0.1.0"
description = "Tablewise - AI restaurant booking backend for Ember & Vine"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "chromadb>=1.0",
    "fastembed>=0.4",
    "langgraph>=0.4",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "mcp>=1.9",
    "python-dotenv>=1.0",
    "langchain-groq>=1.1.3",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Broad excepts are deliberate at tool/stream boundaries: errors go back to the agent or UI instead of crashing.
extend-ignore = ["BLE001", "S110"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
