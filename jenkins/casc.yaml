# Jenkins Configuration as Code for the Tablewise controller.
# Secrets come from container env vars (GITHUB_OWNER, GITHUB_TOKEN, JIRA_API_TOKEN) set by run.sh - never from files.
jenkins:
  systemMessage: "Tablewise CI - Ember & Vine booking concierge"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: admin
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    url: http://localhost:8080/

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: github-token
              description: GitHub token for the tablewise repo
              username: ${GITHUB_OWNER}
              password: ${GITHUB_TOKEN}
          - string:
              scope: GLOBAL
              id: jira-token
              description: Jira API token for build comments
              secret: ${JIRA_API_TOKEN}

jobs:
  - script: |
      multibranchPipelineJob('tablewise') {
        description('Tablewise CI: every branch and pull request of the tablewise repo')
        branchSources {
          branchSource {
            source {
              github {
                id('tablewise-github')
                repoOwner('${GITHUB_OWNER}')
                repository('tablewise')
                repositoryUrl('https://github.com/${GITHUB_OWNER}/tablewise')
                configuredByUrl(false)
                credentialsId('github-token')
                traits {
                  gitHubBranchDiscovery {
                    strategyId(3)
                  }
                  gitHubPullRequestDiscovery {
                    strategyId(1)
                  }
                }
              }
            }
          }
        }
        orphanedItemStrategy {
          discardOldItems {
            numToKeep(20)
          }
        }
        triggers {
          periodicFolderTrigger {
            interval('5m')
          }
        }
      }
